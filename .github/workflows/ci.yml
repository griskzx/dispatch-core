name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable && rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Run documentation tests
        run: cargo test --doc
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install minimum Rust version
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check library with minimum Rust version
        run: cargo +1.85.0 check --lib

  embedded:
    name: Cortex-M0 no_std
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install embedded target
        run: rustup target add thumbv6m-none-eabi
      - name: Check no_std build
        run: cargo check --target thumbv6m-none-eabi
